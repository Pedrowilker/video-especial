<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="Reprodutor de vídeo online">
  <title>Vídeo</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="script.js"></script>
</head>
<body class="watch-page">
  <main class="watch-shell">
    <div id="player-wrap" class="player-wrap">
      <div id="empty-state" class="empty-state" hidden><div class="empty-icon" aria-hidden="true">▶</div><p>Nenhum vídeo disponível</p></div>
      <video id="video-player" controls playsinline preload="metadata" hidden></video>
      <div id="loading-state" class="loading-state"><span class="spinner"></span></div>
      <p id="status-message" class="status-message" role="status" hidden></p>
    </div>
  </main>
</body>
</html>
