<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="Biblioteca de arquivos">
  <title>Biblioteca</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261018-8">
  <script src="config.js?v=20261018-8"></script>
  <script defer src="script.js?v=20261018-8"></script>
</head>
<body class="watch-page">
  <main class="watch-shell">
    <header class="site-header">
      <h1 class="site-title">Biblioteca</h1>
    </header>

    <form id="folder-form" class="folder-form" autocomplete="off">
      <div class="folder-form-row">
        <input id="folder-input" name="folder" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true"
          aria-label="Link da pasta do Google Drive"
          placeholder="Cole o link da pasta do Google Drive" required>
        <button id="load-folder-button" type="submit" class="folder-submit">Abrir</button>
      </div>
    </form>

    <div class="folder-navigation">
      <button id="back-folder-button" type="button" class="folder-back" hidden>← Voltar</button>
      <p id="folder-summary" class="folder-summary" aria-live="polite" hidden></p>
    </div>

    <div id="loading-state" class="loading-state" hidden><span class="spinner"></span></div>
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-icon" aria-hidden="true">▱</div>
      <p id="empty-message">Nenhum arquivo encontrado.</p>
    </div>


    <section id="music-player" class="music-player" aria-label="Player de músicas" hidden>
      <div class="music-player-heading">
        <div class="music-cover" aria-hidden="true">♫</div>
        <div class="music-track-details">
          <p class="music-eyebrow">PLAYER DE MÚSICA</p>
          <h2 id="music-current-title">Selecione uma música</h2>
          <p id="music-current-meta">Sua playlist do Google Drive</p>
        </div>
        <a id="music-open-drive" class="music-open-drive" href="#" target="_blank" rel="noopener noreferrer" hidden>Abrir no Drive</a>
      </div>
      <audio id="music-audio" preload="metadata"></audio>
      <div id="music-error" class="music-error" role="status" hidden></div>
      <div class="music-controls">
        <button id="music-previous" type="button" class="music-control-button" aria-label="Música anterior" title="Música anterior">|◀</button>
        <button id="music-toggle" type="button" class="music-control-button music-play-button" aria-label="Reproduzir" title="Reproduzir">▶</button>
        <button id="music-next" type="button" class="music-control-button" aria-label="Próxima música" title="Próxima música">▶|</button>
      </div>
      <div class="music-progress">
        <span id="music-current-time">0:00</span>
        <input id="music-seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posição da música">
        <span id="music-duration">0:00</span>
      </div>
      <label class="music-autoplay"><input id="music-autoplay-toggle" type="checkbox" checked> Reproduzir próxima automaticamente</label>
      <div id="music-playlist" class="music-playlist"></div>
    </section>

    <div id="public-video-list" class="public-video-list"></div>
    <p id="status-message" class="status-message" role="status" hidden></p>
  </main>
</body>
</html>
